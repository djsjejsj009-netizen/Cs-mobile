                <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS Mobile</title>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0e1015; font-family: sans-serif; color: white; }

        @media screen and (orientation: portrait) {
            #rotate-warning { display: flex !important; }
        }
        #rotate-warning { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; justify-content: center; align-items: center; text-align: center; font-size: 20px; }

        /* МЕНЮ И ВЫБОР КОМАНДЫ */
        #main-menu { position: absolute; inset: 0; background: linear-gradient(135deg, #1a1c24 0%, #0d0e12 100%); z-index: 100; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; }
        .menu-header { display: flex; justify-content: space-between; align-items: center; }
        .profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; background: #3a3d4a; border-radius: 8px; border: 2px solid #5a5e73; }
        
        .team-select { display: flex; gap: 20px; position: absolute; bottom: 30px; right: 30px; }
        .btn-t { padding: 18px 35px; background: #d9534f; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(217, 83, 79, 0.4); }
        .btn-ct { padding: 18px 35px; background: #0275d8; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(2, 117, 216, 0.4); }

        /* HUD */
        #game-ui { display: none; position: absolute; inset: 0; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff00; font-size: 20px; text-shadow: 0 0 2px black; }
        
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 45px; height: 45px; background: rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%); }
        
        #touch-look-zone { position: absolute; top: 0; right: 0; width: 60%; height: 100%; pointer-events: auto; }

        #fire-btn { position: absolute; bottom: 30px; right: 30px; width: 85px; height: 85px; background: rgba(255,0,0,0.6); border: 3px solid white; border-radius: 50%; color: white; font-weight: bold; font-size: 16px; pointer-events: auto; }
        #ammo-counter { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 6px 18px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="rotate-warning">Пожалуйста, поверните устройство горизонтально 🔄</div>

    <div id="main-menu">
        <div class="menu-header">
            <div class="profile">
                <div class="avatar"></div>
                <div>
                    <h2 style="margin:0;">DEV_PLAYER</h2>
                    <p style="margin:5px 0 0 0; color: #aaa;">ID: 1008174</p>
                </div>
            </div>
        </div>
        <div class="team-select">
            <button class="btn-t" onclick="startGame('T')">ИГРАТЬ ЗА Т</button>
            <button class="btn-ct" onclick="startGame('CT')">ИГРАТЬ ЗА КТ</button>
        </div>
    </div>

    <div id="game-ui">
        <div id="crosshair">+</div>
        <div id="joystick-zone"><div id="joystick-stick"></div></div>
        <div id="touch-look-zone"></div>
        <button id="fire-btn">ОГОНЬ</button>
        <div id="ammo-counter">30 / 90</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, gun;
        let ammo = 30;
        const moveState = { forward: 0, right: 0 };
        let lookTouchId = null, lastTouchX = 0, lastTouchY = 0;
        let lon = 0, lat = 0;

        // Точки спавна для команд
        const spawns = {
            T: { x: -40, y: 3, z: 50 },
            CT: { x: 40, y: 3, z: -50 }
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.AmbientLight(0xffffff, 2.5);
            scene.add(light);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            scene.add(camera);

            const loader = new GLTFLoader();

            // Загрузка и УВЕЛИЧЕНИЕ карты в 20 раз
            loader.load('map.glb', (gltf) => {
                const mapModel = gltf.scene;
                mapModel.scale.set(20, 20, 20);
                scene.add(mapModel);
            });
            
            // Настройка автомата
            loader.load('ak47.glb', (gltf) => {
                gun = gltf.scene;
                gun.position.set(0.18, -0.18, -0.35);
                gun.scale.set(0.6, 0.6, 0.6);
                camera.add(gun);
            });

            setupControls();
            animate();
        }

        window.startGame = function(team) {
            // Телепорт на спавн выбранной команды
            const spawnPos = spawns[team];
            camera.position.set(spawnPos.x, spawnPos.y, spawnPos.z);

            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        };

        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            
            zone.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                const dx = touch.clientX - (rect.left + rect.width/2);
                const dy = touch.clientY - (rect.top + rect.height/2);
                moveState.right = dx / 70;
                moveState.forward = -dy / 70;
                stick.style.transform = `translate(-50%, -50%) translate(${dx/2}px, ${dy/2}px)`;
            });

            zone.addEventListener('touchend', () => {
                moveState.forward = 0; moveState.right = 0;
                stick.style.transform = `translate(-50%, -50%)`;
            });

            const lookZone = document.getElementById('touch-look-zone');
            lookZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            });

            lookZone.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === lookTouchId) {
                        lon -= (touch.clientX - lastTouchX) * 0.2;
                        lat -= (touch.clientY - lastTouchY) * 0.2;
                        lat = Math.max(-85, Math.min(85, lat));
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            });

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('fire-btn').addEventListener('touchstart', () => {
                if (ammo > 0) {
                    ammo--;
                    document.getElementById('ammo-counter').innerText = `${ammo} / 90`;
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);

                    if (gun) {
                        gun.position.z += 0.02;
                        setTimeout(() => gun.position.z -= 0.02, 50);
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3(
                Math.sin(phi) * Math.cos(theta),
                Math.cos(phi),
                Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(camera.position.clone().add(target));

            // Скорость передвижения по увеличенной карте
            camera.translateZ(-moveState.forward * 0.25);
            camera.translateX(moveState.right * 0.25);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
