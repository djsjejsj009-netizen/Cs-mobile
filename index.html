<!DOCTYPE html>
<html>
<head>
    <title>CS Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff00; font-size: 24px; font-family: sans-serif; pointer-events: none; }
        #fireBtn { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: red; color: white; border-radius: 50%; border: 3px solid white; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <button id="fireBtn">FIRE</button>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Голубое небо

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.AmbientLight(0xffffff, 2);
        scene.add(light);

        scene.add(camera);

        // Поднимаем камеру чуть выше, чтобы не застревать в полу
        camera.position.set(0, 5, 10);

        const loader = new GLTFLoader();

        // Загрузка карты
        loader.load('map.glb', (gltf) => {
            scene.add(gltf.scene);
        });

        // Загрузка автомата
        loader.load('ak47.glb', (gltf) => {
            const gun = gltf.scene;
            gun.position.set(0.2, -0.3, -0.5);
            gun.scale.set(0.5, 0.5, 0.5);
            camera.add(gun);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
